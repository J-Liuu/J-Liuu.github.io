    // This project contains only the membrane sequence, levels 1A-1F.
    const levels = [...MEMBRANE_LEVELS];


    const WATER_CHANNEL_LEVEL_ID = "water-channel";
    // OSMOSIS_CHALLENGE_LEVEL_ID, OSMOSIS_GOAL_SECONDS, OSMOSIS_TICK_MS, OSMOSIS_CENTER
    // and OSMOSIS_CHANNELS now live in sims/osmosis.js (loaded before this script).

      wasteVesicles: [],

      wasteVesicleReviewQueued: false,
      combinedTransportReviewQueued: false,

    };

    let sfxAudioContext = null;

    const statMeta = [
      ["atp", "ATP"], ["glucose", "Glucose"], ["oxygen", "Oxygen"], ["protein", "Protein"],
      ["toxinsInside", "Toxins Inside"], ["outsideSalt", "Outside Salt"], ["waste", "Waste"], ["water", "Water"], ["transport", "Transport"], ["size", "Cell size"],
      ["sunlight", "Sunlight"], ["delivery", "Delivery"], ["membraneHealth", "Membrane Health"]
    ];

    const svg = document.getElementById("cellSvg");
    const messages = document.getElementById("messages");
    const details = document.getElementById("details");
    const toast = document.getElementById("toast");
    const levelHintBtn = document.getElementById("levelHintBtn");
    const levelHintPopup = document.getElementById("levelHintPopup");

    function clamp(n, min = 0, max = 100) { return Math.max(min, Math.min(max, Math.round(n))); }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, ch => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[ch]));
    }

    function levelHintPlayText(level = currentLevel()) {
      if (!level?.membraneDemoMode) return "";
      if (isCombinedTransportLevel(level)) {
        return "Drag water to the blue Water Channel, drag glucose to the yellow Glucose Door, and pack inside waste into vesicles. A full vesicle releases waste outside near the bottom exit.";
      }
      if (isSimpleMoleculeDragLevel(level)) {
        return simpleMoleculeDragKind(level) === "oxygen"
          ? "Move all 5 oxygen molecules through the membrane into the cell. After the checkpoint, move those same 5 molecules back outside."
          : "Drag large molecules toward the phospholipid membrane. Release from the middle or closer and watch them bounce off.";
      }
      if (isWaterDragLevel(level)) {
        const waterStart = waterDragStartSide(level) === "outside" ? "outside-cell box" : "inside-cell box";
        const waterTarget = waterDragTargetSide(level) === "outside" ? "outside cell" : "inside cell";
        return `Drag water in the ${waterStart}. Release it at the Water Channel to move it into the ${waterTarget}.`;
      }
      if (isGlucoseDragLevel(level)) {
        return level.glucoseDragChallenge?.autoDoor
          ? "Drag glucose into the Glucose Door. The door opens, closes, then releases glucose inside."
          : "Click the lever up to open the left door. Drag glucose into the door, then click the lever down to release it inside.";
      }
      if (isWasteVesicleLevel(level)) {
        return "Drag floating waste blocks into moving vesicle bubbles. A vesicle exports automatically when it holds 3 waste blocks.";
      }
      if (level.demoStage === "transportReview") {
        return "Review each path: oxygen slips through, water uses the channel, glucose uses the door, and waste exits.";
      }
      return "";
    }

    function showLevelHintPopup() {
      const level = currentLevel();
      if (!level || !levelHintPopup) return;
      const playText = levelHintPlayText(level);

      levelHintPopup.innerHTML = `
        <div class="learning-card">
          <div class="learning-step">Level Hint</div>
          <h3>${escapeHtml(level.title)}</h3>
          <div class="learning-grid">
            <div class="learning-point-bubble">
              <p><b>Goal:</b> ${escapeHtml(level.goal)}</p>
              <p><b>Scenario:</b> ${escapeHtml(level.scenario)}</p>
              ${playText ? `<p><b>How to play:</b> ${escapeHtml(playText)}</p>` : ""}
              <p><b>Hint:</b> ${escapeHtml(level.hint)}</p>
              <p><b>Evidence:</b> ${escapeHtml(level.evidence)}</p>
            </div>
          </div>
          <div class="learning-actions">
            <button class="ghost" onclick="closeLevelHintPopup()">Close</button>
          </div>
        </div>
      `;
      levelHintPopup.classList.add("visible");
    }

    function closeLevelHintPopup() {
      if (!levelHintPopup) return;
      levelHintPopup.classList.remove("visible");
      levelHintPopup.innerHTML = "";
    }

    function getSfxAudioContext() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return null;
      if (!sfxAudioContext) sfxAudioContext = new AudioContextClass();
      if (sfxAudioContext.state === "suspended") sfxAudioContext.resume().catch(() => {});
      return sfxAudioContext;
    }

    function snapshotStats(stats = state.stats) {
      const keys = ["atp", "toxinsInside", "waste", "membraneHealth", "outsideSalt", "water", "size", "transport", "glucose", "oxygen"];
      return Object.fromEntries(keys.filter(key => stats && stats[key] !== undefined).map(key => [key, stats[key]]));
    }

    function actionLabel(action) {
      const labels = {
        cleaner: "Sent Cleaner Protein",
        trashTaker: "Sent Garbage Man Protein",
        demoWaterGate: "Moved Water Through Channel",
        demoGlucoseDoor: "Moved Glucose Through Door",
        demoLargeMoleculeBlock: "Watched Large Molecules Bounce",
        demoWasteExit: "Used Waste Exit",
        addSaltOutside: "Added Salt Outside",
        addWaterOutside: "Added Water Outside",
        balanceOutside: "Balanced Outside",
        repairMembrane: "Repaired Membrane",
        importGlucose: "Imported Glucose",
        runRespiration: "Ran Respiration",
        repairMito: "Repaired Mitochondria",
        exportWaste: "Exported Waste",
        challengeAI: "Challenged AI"
      };
      return labels[action] || action.replace(/([A-Z])/g, " $1").replace(/^./, c => c.toUpperCase());
    }

    function isInteractiveGameLevel(level = currentLevel()) {
      return !!level && (
        !level.membraneDemoMode ||
        ["sneaky", "mixed", "damaging", "waterBalance"].includes(level.demoStage) ||
        !!level.combinedTransportChallenge
      );
    }

    function recordStatSnapshot(reason = "Stats changed", delta = null) {
      if (!isInteractiveGameLevel()) return;
      const now = Date.now();
      const previous = state.statHistory[state.statHistory.length - 1];
      if (previous && now - previous.time < 700 && !delta) return;
      state.statHistory.push({
        time: now,
        reason,
        delta,
        stats: snapshotStats()
      });
      if (state.statHistory.length > 60) state.statHistory.shift();
    }

    function beginActionLog(action) {
      if (!isInteractiveGameLevel()) return null;
      const entry = {
        time: Date.now(),
        action,
        label: actionLabel(action),
        before: snapshotStats(),
        after: null
      };
      state.actionHistory.push(entry);
      if (state.actionHistory.length > 40) state.actionHistory.shift();
      return entry;
    }

    function finishActionLog(entry) {
      if (!entry || entry.after) return;
      entry.after = snapshotStats();
    }

    function setStats(newStats) {
      state.stats = { ...state.stats, ...newStats };
      for (const key in state.stats) state.stats[key] = clamp(state.stats[key]);
      renderStats();
      recordStatSnapshot("Stats set", newStats);
    }

    function adjustStats(delta) {
      const next = { ...state.stats };
      for (const key in delta) next[key] = clamp((next[key] || 0) + delta[key]);
      state.stats = next;
      renderStats(delta);
      recordStatSnapshot("Stats changed", delta);
      evaluateLossConditions();
    }

    function statStatus(key, value) {
      if (key === "outsideSalt") {
        if (value <= 15 || value >= 85) return "critical";
        if (value <= 30 || value >= 70) return "warning";
        return "";
      }
      if (key === "size" && currentLevel().membraneDemoMode && currentLevel().demoStage === "waterBalance") {
        if (value <= 20 || value >= 86) return "critical";
        if (value <= 35 || value >= 70) return "warning";
        return "";
      }
      if (key === "toxinsInside") {
        if (value >= 20) return "critical";
        if (value >= 12) return "warning";
        return "";
      }
      if (key === "waste" || key === "size") {
        if (value > 85) return "critical";
        if (value > 65) return "warning";
        return "";
      }
      if (key === "water") {
        if (value > 85 || value < 15) return "critical";
        if (value > 75 || value < 30) return "warning";
        return "";
      }
      if (key === "membraneHealth") {
        if (value <= 24) return "critical";
        if (value <= 49) return "warning";
        return "";
      }
      if (key === "sunlight" && state.cellType === "animal") return "";
      if (value < 15) return "critical";
      if (value < 30) return "warning";
      return "";
    }

    function statColor(key, value) {
      if (key === "outsideSalt") {
        return (value <= 15 || value >= 85) ? "var(--bad)" : (value <= 30 || value >= 70) ? "var(--warn)" : "var(--good)";
      }
      if (key === "size" && currentLevel().membraneDemoMode && currentLevel().demoStage === "waterBalance") {
        return (value <= 20 || value >= 86) ? "var(--bad)" : (value <= 35 || value >= 70) ? "var(--warn)" : "var(--good)";
      }
      if (key === "toxinsInside") {
        return value >= 20 ? "var(--bad)" : value >= 12 ? "var(--warn)" : "var(--good)";
      }
      if (key === "waste" || key === "size") {
        return value > 70 ? "var(--bad)" : value > 45 ? "var(--warn)" : "var(--good)";
      }
      if (key === "water") {
        return value > 85 ? "var(--bad)" : value > 75 ? "var(--warn)" : value < 20 ? "var(--bad)" : value < 35 ? "var(--warn)" : "var(--good)";
      }
      if (key === "membraneHealth") {
        return value <= 24 ? "var(--bad)" : value <= 49 ? "var(--warn)" : value < 100 ? "var(--good)" : "linear-gradient(90deg, var(--good), var(--cyan))";
      }
      return value < 25 ? "var(--bad)" : value < 50 ? "var(--warn)" : "linear-gradient(90deg, var(--blue), var(--cyan))";
    }

    function isWaterDragLevel(level = currentLevel()) {
      return !!(level && level.membraneDemoMode && level.demoStage === "transport" && level.waterDragChallenge);
    }

    function isGlucoseDragLevel(level = currentLevel()) {
      return !!(level && level.membraneDemoMode && level.demoStage === "transport" && level.glucoseDragChallenge);
    }

    function isWasteVesicleLevel(level = currentLevel()) {
      return !!(level && level.membraneDemoMode && level.demoStage === "transport" && level.wasteVesicleChallenge);
    }

    function isCombinedTransportLevel(level = currentLevel()) {
      return !!(level && level.membraneDemoMode && level.demoStage === "transport" && level.combinedTransportChallenge);
    }

    function simpleMoleculeDragKind(level = currentLevel()) {
      if (!level || !level.membraneDemoMode || level.demoStage !== "transport") return null;
      if (level.oxygenDragChallenge) return "oxygen";
      if (level.largeMoleculeDragChallenge) return "largeMolecule";
      return null;
    }

    function isSimpleMoleculeDragLevel(level = currentLevel()) {
      return !!simpleMoleculeDragKind(level);
    }

    function simpleMoleculeDragGoal(level = currentLevel()) {
      const kind = simpleMoleculeDragKind(level);
      const config = kind === "oxygen" ? level?.oxygenDragChallenge : level?.largeMoleculeDragChallenge;
      return Math.max(1, Number(config?.goal) || 5);
    }

    function waterDragGoal(level = currentLevel()) {
      return Math.max(1, Number(level?.waterDragChallenge?.goal) || 5);
    }

    function glucoseDragGoal(level = currentLevel()) {
      return Math.max(1, Number(level?.glucoseDragChallenge?.goal) || 5);
    }

    function wasteVesicleGoal(level = currentLevel()) {
      return Math.max(WASTE_VESICLE_CAPACITY, Number(level?.wasteVesicleChallenge?.goal) || 6);
    }

    function waterDragDirection(level = currentLevel()) {
      return level?.waterDragChallenge?.direction === "out" ? "out" : "in";
    }

    function waterDragStartSide(level = currentLevel()) {
      return waterDragDirection(level) === "out" ? "inside" : "outside";
    }

    function waterDragTargetSide(level = currentLevel()) {
      return waterDragDirection(level) === "out" ? "outside" : "inside";
    }

    function renderStats(delta = {}) {
      const box = document.getElementById("stats");
      const level = currentLevel();
      if (!box) {
        updateMembraneDemoVisuals();
        return;
      }
      if (isCombinedTransportLevel(level)) {
        const progressItems = [
          ["Water through channel", state.waterDragTransported || 0, waterDragGoal(level), ""],
          ["Glucose through door", state.glucoseDragTransported || 0, glucoseDragGoal(level), " glucose-progress"],
          ["Waste by vesicles", state.wasteVesicleExported || 0, wasteVesicleGoal(level), " waste-progress"]
        ];
        box.innerHTML = progressItems.map(([label, value, goal, progressClass]) => {
          const transported = Math.min(goal, value);
          const pct = Math.round((transported / goal) * 100);
          return `
            <div class="water-transport-progress combo-progress${progressClass}">
              <div class="stat-top"><span class="stat-name">${label}</span><span class="stat-value">${transported}/${goal}</span></div>
              <div class="bar"><span style="width:${pct}%;"></span></div>
            </div>
          `;
        }).join("");
        const scoreBadge = document.getElementById("scoreBadge");
        const aiBadge = document.getElementById("aiBadge");
        if (scoreBadge) scoreBadge.textContent = `Score ${state.score}`;
        if (aiBadge) aiBadge.textContent = `AI checks ${state.aiChecks}`;
        updateMembraneDemoVisuals();
        return;
      }
      if (isSimpleMoleculeDragLevel(level) || isWaterDragLevel(level) || isGlucoseDragLevel(level) || isWasteVesicleLevel(level)) {
        const simpleMode = isSimpleMoleculeDragLevel(level);
        const simpleKind = simpleMoleculeDragKind(level);
        const glucoseMode = isGlucoseDragLevel(level);
        const wasteMode = isWasteVesicleLevel(level);
        const goal = simpleMode ? simpleMoleculeDragGoal(level) : wasteMode ? wasteVesicleGoal(level) : glucoseMode ? glucoseDragGoal(level) : waterDragGoal(level);
        const transported = Math.min(goal, simpleMode ? (state.simpleMoleculeDragCompleted || 0) : wasteMode ? (state.wasteVesicleExported || 0) : glucoseMode ? (state.glucoseDragTransported || 0) : (state.waterDragTransported || 0));
        const pct = Math.round((transported / goal) * 100);
        const oxygenProgressLabel = state.simpleMoleculeDragPhase === "out" ? "Oxygen moved outside" : "Oxygen moved inside";
        const label = simpleMode ? (simpleKind === "oxygen" ? oxygenProgressLabel : "Large molecules bounced") : wasteMode ? "Waste exported by vesicles" : glucoseMode ? "Glucose transported through" : "Water transported through";
        const progressClass = simpleMode ? (simpleKind === "oxygen" ? " oxygen-progress" : " large-progress") : wasteMode ? " waste-progress" : glucoseMode ? " glucose-progress" : "";
        box.innerHTML = `
          <div class="water-transport-progress${progressClass}">
            <div class="stat-top"><span class="stat-name">${label}</span><span class="stat-value">${transported}/${goal}</span></div>
            <div class="bar"><span style="width:${pct}%;"></span></div>
          </div>
        `;
        const scoreBadge = document.getElementById("scoreBadge");
        const aiBadge = document.getElementById("aiBadge");
        if (scoreBadge) scoreBadge.textContent = `Score ${state.score}`;
        if (aiBadge) aiBadge.textContent = `AI checks ${state.aiChecks}`;
        updateMembraneDemoVisuals();
        return;
      }
      const visibleKeys = level.relevantStats || statMeta.map(([key]) => key);
      box.innerHTML = "";
      statMeta.forEach(([key, label]) => {
        if (!visibleKeys.includes(key)) return;
        const value = key === "sunlight" && state.cellType === "animal" ? 0 : (state.stats[key] ?? (key === "membraneHealth" ? 100 : 0));

          <div class="stat-top"><span class="stat-name">${label}</span><span class="stat-value">${value}</span></div>
          <div class="bar"><span style="width:${barWidth}%; background:${color};"></span></div>

        box.appendChild(stat);
      });
      const scoreBadge = document.getElementById("scoreBadge");
      const aiBadge = document.getElementById("aiBadge");
      if (scoreBadge) scoreBadge.textContent = `Score ${state.score}`;
      if (aiBadge) aiBadge.textContent = `AI checks ${state.aiChecks}`;
      updateMembraneDemoVisuals();
    }

    function levelChatId(index = state.levelIndex) {
      const level = levels[index];
      return level ? (level.id || `level-${index}`) : `level-${index}`;
    }

    function levelIndexById(id) {
      return levels.findIndex((level, index) => (level.id || `level-${index}`) === id);
    }

    function chatLabel(id) {
      const index = levelIndexById(id);
      return index >= 0 ? levels[index].title : "Previous level";
    }

    function ensureChatThread(id) {
      if (!state.chatThreads[id]) {
        state.chatThreads[id] = [];
        state.chatThreadOrder.push(id);
      }
      return state.chatThreads[id];
    }

    function currentChatThread() {
      const id = state.activeChatLevelId || levelChatId();
      state.activeChatLevelId = id;
      return ensureChatThread(id);
    }

    function buildMessageNode(entry) {
      const node = document.createElement("div");
      node.className = `msg ${entry.type}`;
      const text = document.createElement("div");
      text.textContent = entry.text;
      node.appendChild(text);

      if (entry.actions === "osmosisOffer") {
        const actions = document.createElement("div");
        actions.className = "chat-actions";

        const tryButton = document.createElement("button");
        tryButton.className = "primary";
        tryButton.textContent = "Try Osmosis Challenge";
        tryButton.disabled = state.osmosisSideQuestChoiceMade;
        tryButton.addEventListener("click", startOsmosisSideQuest);

        const continueButton = document.createElement("button");
        continueButton.className = "ghost";
        continueButton.textContent = "Keep Going";
        continueButton.disabled = state.osmosisSideQuestChoiceMade;
        continueButton.addEventListener("click", declineOsmosisSideQuest);

        actions.appendChild(tryButton);
        actions.appendChild(continueButton);
        node.appendChild(actions);
      }

      return node;
    }

    function renderChat() {
      if (!messages) return;
      messages.innerHTML = "";
      const activeId = state.activeChatLevelId || levelChatId();
      const archivedIds = state.chatThreadOrder.filter(id => id !== activeId && (state.chatThreads[id] || []).length);

      archivedIds.forEach(id => {
        const archive = document.createElement("details");
        archive.className = "chat-archive";
        const summary = document.createElement("summary");
        summary.textContent = `${chatLabel(id)} chat (${state.chatThreads[id].length})`;
        archive.appendChild(summary);

        const archiveMessages = document.createElement("div");
        archiveMessages.className = "chat-archive-messages";
        state.chatThreads[id].forEach(entry => archiveMessages.appendChild(buildMessageNode({ ...entry, actions: null })));
        archive.appendChild(archiveMessages);
        messages.appendChild(archive);
      });

      const activeMessages = document.createElement("div");
      activeMessages.className = "active-chat";
      activeMessages.id = "activeChatMessages";
      ensureChatThread(activeId).forEach(entry => activeMessages.appendChild(buildMessageNode(entry)));
      messages.appendChild(activeMessages);
      messages.scrollTop = messages.scrollHeight;
    }

    function addMessage(type, text, options = {}) {
      currentChatThread().push({ type, text, actions: options.actions || null });
      renderChat();
    }

    function bot(text, options = {}) { addMessage("bot", text, options); }
    function user(text) { addMessage("user", text); }
    function sys(text) { addMessage("system", text); }

    function loseLevel(reason) {
      if (state.levelLost) return true;
      const losingLevel = currentLevel();
      const losingSize = state.stats?.size ?? 50;
      const osmosisDeathKind = losingLevel.membraneDemoMode && losingLevel.demoStage === "waterBalance"
        ? (losingSize >= 70 ? "swellExplosion" : losingSize <= 35 ? "shrinkPop" : null)
        : null;
      state.levelLost = true;
      state.lossReason = reason;
      state.completedLevel = false;
      stopMembraneDemo();
      restoreOsmosisCellBody();
      if (osmosisDeathKind) triggerOsmosisDeathAnimation(osmosisDeathKind);
      const message = `Cell failed: ${reason} Click Reset to retry this level.`;
      toast.textContent = message;
      const feedback = document.getElementById("demoFeedback");
      if (feedback) feedback.textContent = message;
      const goal = document.getElementById("levelGoal");
      if (goal) goal.textContent = "Cell failed. Click Reset to retry this level.";
      sys(message);
      renderDetails();
      renderStats();
      if (losingLevel.membraneDemoMode && losingLevel.demoStage === "waterBalance") {
        showOsmosisRecapPopup("loss");
      } else {
        showGameRecapPopup("loss");
      }
      return true;
    }

    function evaluateLossConditions() {
      if (state.levelLost || !state.stats) return state.levelLost;
      const s = state.stats;
      const level = currentLevel();

      if ((s.membraneHealth ?? 100) <= 0) {
        return loseLevel("Membrane Health reached 0, so the cell can no longer control what enters or exits.");
      }

      // In the water-balance mini-game, do not use the older global Water 0/100 failure.
      // The whole point of this level is to give the player time to react to swelling/shrinking.
      // Failure is based on cell size plus a short danger grace period instead.
      if (level.membraneDemoMode && level.demoStage === "waterBalance") {
        const sizeDangerTime = state.osmosisDangerTicks || 0;
        if ((s.size ?? 50) <= 6 || ((s.size ?? 50) <= 18 && sizeDangerTime >= 4)) {
          return loseLevel("The cell shrank too much because the outside stayed too salty and water kept leaving.");
        }
        if ((s.size ?? 50) >= 97 || ((s.size ?? 50) >= 90 && sizeDangerTime >= 4)) {
          return loseLevel("The cell swelled too much because the outside stayed too watery and water kept entering.");
        }
      } else {
        if ((s.water ?? 50) >= 100) {
          return loseLevel("Water reached 100. Too much water entered, so the cell burst from water imbalance.");
        }
        if ((s.water ?? 50) <= 0) {
          return loseLevel("Water reached 0. The cell dried out and could not keep its shape or chemistry working.");
        }
      }
      const toxinsInside = s.toxinsInside ?? 0;
      if (level.membraneDemoMode && ["sneaky", "mixed"].includes(level.demoStage)) {
        if (toxinsInside >= 20) {
          return loseLevel("Toxins Inside reached 20. Too many sneaky toxins built up in the cytoplasm before Cleaner could handle them.");
        }
        if (!state.cleanupWaveActive && toxinsInside >= 10 && (s.atp ?? 0) < 5) {
          return loseLevel("Toxins Inside is high and ATP is below 5, so the cell does not have enough energy to send Cleaner.");
        }
      }
      if ((s.waste ?? 0) >= 100) {
        return loseLevel("Waste reached 100. Toxic buildup overwhelmed the cell before it could clean up and export waste.");
      }
      if ((s.transport ?? 50) <= 0) {
        return loseLevel("Transport reached 0. Materials can no longer move through the cell factory.");
      }
      return false;
    }

      if (state.levelLost) {

      state.cellType = type;
      if (type === "plant") {

        bot("Plant cell mode enabled. Remember: chloroplasts make glucose, but mitochondria still make ATP.");
      } else {
        setStats({ sunlight: 0, wall: 0 });
        toast.textContent = "Animal mode: no cell wall and no chloroplasts. The cell membrane is the main outer boundary.";

      renderDetails();

    function gameRecapLocalSummary(outcome) {
      const level = currentLevel();
      if (outcome === "win") {
        return `You completed the goal for ${level.title}. The strongest evidence was: ${level.evidence}`;
      }
      if (level.demoStage === "sneaky") {
        return "Sneaky toxins built up faster than the helpers removed them. Cleaner Protein handles roaming toxins first, then Garbage Man Protein moves the waste out.";
      }
      if (level.demoStage === "mixed") {
        return "The mixed challenge needs triage: Cleaner for orange toxins, Garbage Man for floating waste, and Repair Membrane for cracks.";
      }
      if (level.demoStage === "damaging") {
        return "Membrane damage stayed too low for too long. Repair Membrane costs ATP, so ATP matters before the cracks become critical.";
      }
      return state.lossReason || "The final stats moved outside the safe range for this level.";
    }

    function buildActionHistoryHtml() {
      if (!state.actionHistory.length) {
        return `<li>No button actions were logged before this recap.</li>`;
      }
      return state.actionHistory.slice(-8).map((entry, index) => {
        const after = entry.after || entry.before || {};
        const statText = Object.entries(after).slice(0, 5).map(([key, value]) => `${key}: ${value}`).join(", ");
        return `<li>${index + 1}. ${escapeHtml(entry.label)} <span class="muted-text">(${escapeHtml(statText)})</span></li>`;
      }).join("");
    }

      if (state.gameRecapShown) return false;

      const popup = document.getElementById("transportLearningPopup");
      if (!popup) return false;
      state.gameRecapShown = true;
      const won = outcome === "win";
      const reviewId = `gameRecapReview-${Date.now()}`;
      const finalStats = snapshotStats();
      const finalStatsHtml = Object.entries(finalStats).map(([key, value]) => `<li>${escapeHtml(key)}: ${escapeHtml(value)}</li>`).join("");

      popup.innerHTML = `
        <div class="learning-card">

    async function requestGameRecapReview(outcome, reviewId) {
      const reviewNode = document.getElementById(reviewId);
      const localSummary = gameRecapLocalSummary(outcome);
      if (!reviewNode) return;
      try {
        const reply = await askCytoBotGemini(
          outcome === "win"
            ? "Review this completed game attempt. Explain what the student did well using the button history and final stats. Keep it to 2 short sentences."
            : "Review this failed game attempt. Explain where the student went wrong using the button history, stat history, and final stats. Give one next-step fix. Keep it to 2 short sentences.",
          {
            recapContext: {
              outcome,
              lossReason: state.lossReason,
              actionHistory: state.actionHistory.slice(-12),
              statHistory: state.statHistory.slice(-16),
              finalStats: snapshotStats()
            }
          }
        );
        reviewNode.innerHTML = `<b>CytoBot review:</b> ${escapeHtml(reply)}`;
      } catch (err) {
        console.warn("Game recap AI review unavailable:", err);
        reviewNode.innerHTML = `<b>CytoBot review:</b> ${escapeHtml(localSummary)}`;
      }
    }

    function particle(color, from, to, count = 8, duration = 900, radius = 6) {
      for (let i = 0; i < count; i++) {
        setTimeout(() => {
          const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
          c.setAttribute("class", "particle");
          c.setAttribute("cx", from[0]);
          c.setAttribute("cy", from[1]);
          c.setAttribute("r", radius);
          c.setAttribute("fill", color);
          svg.appendChild(c);
          const dx = to[0] - from[0] + (Math.random() * 36 - 18);
          const dy = to[1] - from[1] + (Math.random() * 36 - 18);
          c.animate([
            { transform: "translate(0px, 0px)", opacity: .15 },
            { transform: `translate(${dx}px, ${dy}px)`, opacity: 1 },
            { transform: `translate(${dx}px, ${dy}px)`, opacity: 0 }
          ], { duration: duration + Math.random() * 450, easing: "ease-in-out" });
          setTimeout(() => c.remove(), duration + 650);
        }, i * 70);
      }
    }

        const wasNew = !state.completedActions.has(action);
        state.completedActions.add(action);
        if (wasNew && !quietDemoAction) state.score += 10;
        if (!quietDemoAction) {
          sys(`Progress: ${state.completedActions.size}/${level.needed}`);
        }
        if (!state.completedLevel && state.completedActions.size >= level.needed) {
          state.completedLevel = true;
          if (!quietDemoAction) {
            state.score += 25;
            sys("Level complete. You used evidence to solve the problem.");

        case "sendGlucoseMito":
          particle("#fde047", [190, 160], [279, 379], 10, 900, 5);
          burst("Glucose moved toward mitochondria for respiration.", "mitochondria", "#fde047");
          break;
        case "sendOxygenMito":
          particle("#f87171", [115, 240], [279, 379], 10, 900, 5);
          burst("Oxygen moved toward mitochondria for respiration.", "mitochondria", "#f87171");
          break;
        case "repairMito":
          adjustStats({ atp: +12, glucose: -5, oxygen: -5 });
          burst("Mitochondria repaired. ATP production improved.", "mitochondria", "#fb923c");
          break;
        case "collectSunlight":
          if (state.cellType !== "plant") return bot("Animal cells do not have chloroplasts to collect sunlight.");
          adjustStats({ sunlight: +10 });
          particle("#fde047", [110, 40], [182, 286], 12, 850, 4);
          burst("Sunlight collected by chloroplasts.", "chloroplast", "#fde047");
          break;
        case "makeGlucose":
          if (state.cellType !== "plant") return bot("Only plant cells have chloroplasts.");
          if (s.sunlight < 8 || s.water < 4) {
            bot("Making glucose needs sunlight and water. Import water or collect sunlight first.");
            return;
          }
          adjustStats({ sunlight: -8, water: -4, glucose: +24 });
          particle("#fde047", [182, 286], [320, 300], 12, 900, 5);
          burst("Chloroplasts used sunlight and water to make glucose.", "chloroplast", "#84cc16");
          break;
        case "sendGlucoseFromChloro":
          if (state.cellType !== "plant") return bot("This action requires chloroplasts, so it is plant-cell only.");
          particle("#fde047", [182, 286], [279, 379], 12, 1000, 5);
          burst("Glucose moved from chloroplasts toward mitochondria.", "chloroplast", "#fde047");
          break;
        case "showSizeCompare":
          showSizeComparison();
          burst("Small cells transport faster. Large cells have longer distances and lower membrane exchange efficiency.", "size", "#38bdf8");
          break;
        case "upgradeTransportNetwork":
          adjustStats({ transport: +20, delivery: +14, atp: -12, waste: -4 });
          particle("#22d3ee", [180, 260], [700, 310], 20, 900, 5);
          burst("Transport network upgraded. Materials move more efficiently despite size.", "size", "#22d3ee");
          break;
        case "divideCell":
          adjustStats({ size: -38, transport: +24, waste: -10, atp: -10 });
          burst("The oversized cell divided into smaller cells. Surface area to volume balance improved.", "size", "#34d399");
          showSizeComparison();
          break;
        case "repairMembrane":
          if ((s.atp ?? 0) < 10) {
            bot("Repairing the membrane needs 10 ATP. Make more ATP first.");
            return;
          }
          adjustStats({ atp: -10, membraneHealth: +30, transport: +8 });
          animateWrenches();
          if ((state.stats.membraneHealth ?? 100) >= 65) state.membraneCracksUnlocked = false;
          updateMembraneDemoVisuals();
          membraneFeedback("Repair worked: ATP fixed the membrane and cracks faded.", 3, 5200);
          markAction("repairMembrane");
          checkWarnings();
          return;
        case "challengeAI":
          challengeAI();
          return;
        default:
          bot("That action is not implemented yet.");
          return;
      }
      markAction(action);
      checkWarnings();
    }

    function checkWarnings() {
      if (evaluateLossConditions()) return;
      const warnings = [
        ["atp", state.stats.atp < 15, "ATP is very low. Try mitochondria or cellular respiration."],
        ["waste", state.stats.waste > 85, "Waste is dangerously high. Check vacuoles and membrane export."],
        ["transport", state.stats.transport < 20, "Transport is very low. Check cytoplasm, ER/Golgi, membrane, or cell size."],
        ["size", state.stats.size > 85, "Cell size is too large. Use the size simulation to compare small vs. large cells."],
        ["outsideSalt", currentLevel().demoStage === "waterBalance" && ((state.stats.outsideSalt ?? 50) <= 30 || (state.stats.outsideSalt ?? 50) >= 70), "Outside Salt is far from 50. Change the outside condition so water can rebalance automatically."],
        ["toxinsInside", (state.stats.toxinsInside ?? 0) >= 12, "Toxins Inside is building up. Send Cleaner Protein out before it reaches 20, then send Garbage Man Protein out once waste appears."],
        ["membraneHealth", (state.stats.membraneHealth ?? 100) < 25, "The membrane is damaged. Repair it!"],
        ["water", state.stats.water > 85, "Water balance is too full. Release or use water."],
        ["waterDry", state.stats.water < 15, "Water balance is too dry. Import water." ]
      ];
      for (const [key, condition, message] of warnings) {
        if (condition && !state.warnedKeys.has(key)) {
          state.warnedKeys.add(key);
          toast.textContent = "Warning: " + message;
        }
      }
      leakIfMembraneDamaged();
    }

    function askAI() {
      respondToUser("Give me a short helpful hint for this level. Do not give away the full answer.");
    }

    function askHint() {
      respondToUser("I am stuck. Give me one short hint based on the current level.");
    }

    function askWhy() {
      respondToUser("Explain why this level works this way in simple 6th grade words.");
    }

    function checkEvidence() {
      respondToUser("What evidence should I check in the animation and stats?");
    }

    function explainSelected() {
      if (!state.selected) return bot("Click an organelle first, then I can explain it.");
      const o = ORG[state.selected];
      respondToUser(`Explain ${o.name} in this level. Role: ${o.role}.`);
    }

    function challengeAI() {
      state.aiChecks++;
      state.score += 12;
      const level = currentLevel();
      if (level.aiWrong) {
        bot("Good challenge. My earlier suggestion was incomplete or wrong. The stronger answer is based on the evidence:\n\n" + level.evidence + "\n\nCorrect reasoning: " + level.why);
        sys("AI literacy point earned: You challenged AI advice using evidence.");
      } else {
        bot("Fair challenge. In this level my advice was mostly reliable, but checking evidence is still the right habit.");
      }
      markAction("challengeAI");
      renderStats();
    }

    async function askCytoBotGemini(studentText, extraContext = {}) {
      const payload = {
        message: studentText,
        levelTitle: currentLevel().title,
        levelGoal: currentLevel().goal,
        levelScenario: currentLevel().scenario,
        levelHint: currentLevel().hint,
        levelEvidence: currentLevel().evidence,
        selectedOrganelle: state.selected ? {
          key: state.selected,
          name: ORG[state.selected]?.name,
          role: ORG[state.selected]?.role,
          functionText: ORG[state.selected]?.functionText,
          evidence: ORG[state.selected]?.evidence
        } : null,
        stats: state.stats,
        completedActions: Array.from(state.completedActions || []),
        cellType: state.cellType,
        membraneDemoStage: currentLevel().demoStage || null,
        recapContext: extraContext.recapContext || null
      };

      // In SinQ the platform injects window.ScienceAI; route CytoBot through the
      // simulation-chat bridge (-> /api/simulation-exploration/chat). Fall back to
      // the standalone /api/cytobot server when running outside the platform.
      if (window.ScienceAI && typeof window.ScienceAI.requestSimulationChat === "function") {
        const reply = await window.ScienceAI.requestSimulationChat({
          message: studentText,
          requestKind: extraContext.recapContext ? "recap" : "chat",
          levelContext: {
            title: payload.levelTitle,
            goal: payload.levelGoal,
            scenario: payload.levelScenario,
            hint: payload.levelHint,
            evidence: payload.levelEvidence,
            cellType: payload.cellType,
            membraneDemoStage: payload.membraneDemoStage
          },
          selectedOrganelle: payload.selectedOrganelle,
          stats: payload.stats,
          completedActions: payload.completedActions,
          recapContext: payload.recapContext
        });
        return reply || "CytoBot could not think of a helpful answer yet.";
      }

      const response = await fetch("/api/cytobot", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      if (!response.ok) {
        throw new Error(`CytoBot API error: ${response.status}`);
      }

      const data = await response.json();
      return data.reply || "CytoBot could not think of a helpful answer yet.";
    }

    function replaceLastBotMessage(oldText, newText) {
      const thread = currentChatThread();
      const last = [...thread].reverse().find(entry => entry.type === "bot" && entry.text === oldText);
      if (last) {
        last.text = newText;
        renderChat();
      } else {
        bot(newText);
      }
    }

    async function respondToUser(text) {
      const trimmed = text.trim();
      if (!trimmed) return;

      user(trimmed);
      state.aiChecks++;
      renderStats();

      const thinkingText = "CytoBot is thinking...";
      bot(thinkingText);

      try {
        const reply = await askCytoBotGemini(trimmed);
        replaceLastBotMessage(thinkingText, reply);
      } catch (err) {
        console.warn(err);

        const t = trimmed.toLowerCase();
        let fallback = "CytoBot cannot reach Gemini yet. Start the backend server, then try again.";
        if (t.includes("membrane") || t.includes("toxin") || t.includes("oxygen") || t.includes("glucose") || t.includes("water")) {
          fallback = "CytoBot cannot reach Gemini yet. Evidence hint: watch what crosses the membrane, what bounces, and which command changes the stats.";
        } else if (t.includes("hint") || t.includes("stuck")) {
          fallback = "CytoBot cannot reach Gemini yet. Hint: " + currentLevel().hint;
        } else if (t.includes("evidence")) {
          fallback = "CytoBot cannot reach Gemini yet. Evidence to check: " + currentLevel().evidence;
        }
        replaceLastBotMessage(thinkingText, fallback);
      }

      renderStats();
    }

    document.querySelectorAll("[data-org]").forEach(el => {
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        selectOrganelle(el.getAttribute("data-org"));
      });
    });

    function bindClick(id, handler) {
      const node = document.getElementById(id);
      if (node) node.addEventListener("click", handler);
    }

    if (levelHintBtn) levelHintBtn.addEventListener("click", showLevelHintPopup);

    window.runAction = runAction;
    window.addEventListener("beforeunload", stopMembraneDemo);

    prepareInteractiveMembrane();
    loadLevel(0);
  </script>
</body>
</html>
