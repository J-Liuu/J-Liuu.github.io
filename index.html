<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Choose between Jacky Liu's game and technical art portfolio or product design portfolio.">
    <title>Jacky Liu | Portfolio</title>
    <link rel="stylesheet" href="selector.css?v=1">
</head>
<body class="portfolio-selector-page">
    <header class="selector-header">
        <a class="selector-name" href="index.html" aria-label="Jacky Liu portfolio home">Jacky Liu</a>
        <span class="selector-prompt">Choose a portfolio</span>
    </header>

    <main class="portfolio-selector" aria-label="Portfolio selection">
        <a class="portfolio-route game-route" href="game.html">
            <img src="assets/media/flowers-poster.jpg" alt="Procedural flower from Jacky Liu's interactive portfolio">
            <span class="route-shade" aria-hidden="true"></span>
            <span class="route-content">
                <span class="route-index">01</span>
                <span class="route-title">Game &amp;<br>Technical Art</span>
                <span class="route-description">3D environments, shaders, VFX, level design, and interactive work.</span>
                <span class="route-action">Enter portfolio <span aria-hidden="true">&#8594;</span></span>
            </span>
        </a>

        <a class="portfolio-route product-route" href="product-design.html">
            <span class="product-composition" aria-hidden="true">
                <span class="composition-frame frame-one"></span>
                <span class="composition-frame frame-two"></span>
                <span class="composition-cross cross-one"></span>
                <span class="composition-cross cross-two"></span>
                <span class="composition-dot"></span>
            </span>
            <span class="route-content">
                <span class="route-index">02</span>
                <span class="route-title">Product<br>Design</span>
                <span class="route-description">A new collection of product thinking and design work.</span>
                <span class="route-action">Open workspace <span aria-hidden="true">&#8594;</span></span>
            </span>
        </a>
    </main>
</body>
</html>
