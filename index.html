<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jacky Liu | Portfolio</title>
    <link rel="stylesheet" href="style.css?v=flower-video">
    <script src="startup.js?v=flower-freeze" defer></script>
</head>
<body>
    <main class="startup-stage" aria-label="Jacky Liu portfolio">
        <img
            class="blender-ui"
            src="assets/blender_ui_grouped.svg?v=dropdown-selectors"
            alt="Blender-style portfolio workspace"
        >

        <div class="startup-window">
            <div class="startup-art" aria-hidden="true">
                <video
                    class="startup-video"
                    src="assets/media/flowers-intro.mp4"
                    poster="assets/media/flowers-poster.jpg"
                    muted playsinline preload="auto"
                    disablepictureinpicture tabindex="-1"
                ></video>
            </div>
            <img
                class="startup-frame"
                src="assets/blender_startup_grouped_jacky_v7.svg?v=video-overlay"
                alt="Jacky Liu portfolio startup window with project list"
            >
        </div>
    </main>
</body>
</html>
